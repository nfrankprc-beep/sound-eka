<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АВТОЗВУК Б/У Екатеринбург</title>
<style>
  :root{
    --bg:#0b0f17; --card:#141a26; --line:#232c3d; --tx:#e9eef7; --mut:#93a1b8;
    --acc:#2ea6ff; --acc2:#7c5cff; --ok:#37d67a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
  .hero{background:linear-gradient(135deg,#16203a,#1a1330);border:1px solid var(--line);
    border-radius:20px;padding:22px 18px;text-align:center;position:relative;overflow:hidden}
  .hero:before{content:"";position:absolute;inset:-40% -20% auto;height:180px;
    background:radial-gradient(closest-side,rgba(46,166,255,.35),transparent);filter:blur(8px)}
  .logo{width:64px;height:64px;border-radius:16px;margin:0 auto 12px;
    background:conic-gradient(from 210deg,var(--acc),var(--acc2),var(--acc));
    display:flex;align-items:center;justify-content:center;font-size:30px;position:relative}
  h1{margin:6px 0 2px;font-size:20px;letter-spacing:.2px}
  .sub{color:var(--mut);font-size:13px;margin:0}
  .stats{display:flex;gap:10px;margin:16px 0 4px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
  .stat b{display:block;font-size:18px}
  .stat span{color:var(--mut);font-size:12px}
  h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:26px 4px 10px}
  .tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
  .tip .t{font-weight:600;margin-bottom:4px}
  .tip .b{color:var(--mut);font-size:13.5px}
  .cta{display:block;text-align:center;margin-top:22px;padding:15px;border-radius:14px;
    background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;text-decoration:none;font-weight:600}
  .foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo">🔊</div>
    <h1>АВТОЗВУК Б/У Екатеринбург</h1>
    <p class="sub">Доска объявлений и советы по автозвуку</p>
  </div>

  <div class="stats">
    <div class="stat"><b id="members">16 500</b><span>участников</span></div>
    <div class="stat"><b>150+</b><span>советов</span></div>
    <div class="stat"><b><span class="dot"></span>Live</b><span>модерация</span></div>
  </div>

  <h2>Советы «Автозвук на пальцах»</h2>
  <div id="tips"></div>

  <a class="cta" id="go" href="https://vk.com/sound_eka" target="_blank" rel="noopener">Перейти в сообщество →</a>
  <p class="foot">Сообщество продавцов и любителей автозвука Екатеринбурга.<br>Публикация объявлений — через «Предложить новость».</p>
</div>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
  var TIPS = [
    ["Фаза — это половина баса","Соединили динамики в разной полярности — низ пропадает. Проверяйте «плюс-плюс» на каждом канале."],
    ["Шумка окупается громче усилителя","Обработка дверей даёт прибавку по СЧ/НЧ, которую не купишь ваттами."],
    ["Питание решает","Просадка по «плюсу» на усилителе — первая причина клиппинга. Толстый провод и хорошая земля важнее бренда."],
    ["Короб под сабвуфер — не «ящик»","Объём и настройка порта под конкретный динамик меняют отдачу сильнее, чем замена саба."]
  ];
  var box = document.getElementById('tips');
  TIPS.forEach(function(t){
    var d = document.createElement('div'); d.className='tip';
    d.innerHTML = '<div class="t">'+t[0]+'</div><div class="b">'+t[1]+'</div>';
    box.appendChild(d);
  });
  // VK Mini App init (когда открыто внутри VK)
  try { if (window.vkBridge) { vkBridge.send('VKWebAppInit', {}); } } catch(e){}
</script>
</body>
</html>
